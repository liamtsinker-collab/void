<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Void</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>void</h1>
    <div id="stats"></div>
  </header>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="blob-wrap">
      <div class="blob"><div class="fill" id="fill"></div><div class="eyes"><i></i><i></i></div></div>
      <p id="blob-text"></p>
    </div>
    <div class="slot" id="slot"><span id="slot-text">Ready when you are</span></div>
    <button class="big" id="spin">🎲 Spin an experiment</button>
    <div class="row">
      <button class="ghost" id="to-map">🗺️ My map</button>
      <button class="ghost" id="to-wins">🏆 My wins</button>
    </div>
  </section>

  <!-- EXPERIMENT -->
  <section id="exp" class="screen">
    <div class="card" id="card"></div>
    <button class="big" id="accept">I'll do it!</button>
    <div class="row">
      <button class="ghost" id="reroll">🔀 Different one</button>
      <button class="ghost" id="back1">Not now</button>
    </div>
  </section>

  <!-- REFLECT -->
  <section id="reflect" class="screen">
    <h2>You did it. 🎉</h2>
    <p class="sub" id="reflect-title"></p>
    <label>How was your energy <b>before</b>? <output id="bv">3</output></label>
    <input type="range" min="1" max="5" value="3" id="before">
    <div class="ends"><span>😴 drained</span><span>⚡ buzzing</span></div>
    <label>How is your energy <b>now</b>? <output id="av">3</output></label>
    <input type="range" min="1" max="5" value="3" id="after">
    <div class="ends"><span>😴 drained</span><span>⚡ buzzing</span></div>
    <label>Want more of this?</label>
    <div class="row verdicts">
      <button class="verdict" data-v="more">🔥 More!</button>
      <button class="verdict" data-v="neutral">😐 Meh</button>
      <button class="verdict" data-v="never">🚫 Never again</button>
    </div>
    <input type="text" id="note" maxlength="140" placeholder="One line about it (optional)">
    <button class="big" id="save" disabled>Fill the void</button>
    <p class="sub">"Never again" still counts. You learned something.</p>
  </section>

  <!-- MAP -->
  <section id="map" class="screen">
    <h2>Your map 🗺️</h2>
    <div id="map-body"></div>
    <button class="ghost" data-back>← Back</button>
  </section>

  <!-- WINS -->
  <section id="wins" class="screen">
    <h2>Your wins 🏆</h2>
    <div id="wins-body"></div>
    <button class="ghost" data-back>← Back</button>
  </section>

  <footer>
    Void is for exploring, not treatment. If the emptiness feels heavy or won't lift,
    <a href="https://findahelpline.com" target="_blank" rel="noopener">find support here</a>.
    <br><a href="#" id="reset">Reset my data</a>
  </footer>
</div>
<script src="experiments.js"></script>
<script src="app.js"></script>
</body>
</html>
